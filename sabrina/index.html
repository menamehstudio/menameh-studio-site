<body>
<div id="mena-digital-preview">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;700&display=swap');
    #mena-digital-preview {
      --mm-black: #0c0c0c;
      --mm-ink: #0c0c0c;
      --mm-paper: #f2f2f2;
      --mm-grey: #bfbfba;
      --mm-acid: #61d90b;
      padding: 28px 12px;
      display: grid;
      place-items: center;
      color: var(--mm-ink);
      font-family: Inter, Arial, sans-serif;
      min-height: 100vh;
    }
    #mena-digital-preview * { box-sizing: border-box; }
    #mena-digital-preview .phone {
      width: min(390px, 100%);
      overflow: hidden;
      background: var(--mm-paper);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
    }
    #mena-digital-preview .hero {
      position: relative;
      min-height: 270px;
      padding: 26px 24px 24px;
      background: var(--mm-black);
      color: var(--mm-paper);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    #mena-digital-preview .eyebrow,
    #mena-digital-preview .micro {
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: .08em;
      font-weight: 500;
    }
    #mena-digital-preview .brand-logo {
      align-self: center;
      display: block;
      width: 76%;
      height: auto;
    }
    #mena-digital-preview .brand-logo path { fill: #f2f2f2; }
    #mena-digital-preview .studio { align-self: flex-end; }
    #mena-digital-preview .content { padding: 24px; }
    #mena-digital-preview .statement {
      margin: 0 0 30px;
      font-family: 'Archivo Black', Impact, sans-serif;
      font-size: clamp(24px, 6.4vw, 30px);
      line-height: .98;
      letter-spacing: -.035em;
      text-transform: uppercase;
      color: #0c0c0c;
    }
    #mena-digital-preview .name {
      margin: 0;
      font-family: 'Archivo Black', Impact, sans-serif;
      font-size: 25px;
      line-height: 1;
      letter-spacing: -.025em;
      color: #0c0c0c;
    }
    #mena-digital-preview .role {
      margin: 10px 0 24px;
      font-size: 15px;
      line-height: 1.25;
      color: #0c0c0c;
    }
    #mena-digital-preview .primary-action,
    #mena-digital-preview .action {
      min-height: 48px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    #mena-digital-preview .primary-action {
      padding: 0 16px;
      background: var(--mm-black);
      color: var(--mm-paper);
      font-size: 14px;
    }
    #mena-digital-preview .primary-action:hover { background: var(--mm-acid); color: var(--mm-black); }
    #mena-digital-preview .quick {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-top: 1px;
      background: var(--mm-black);
    }
    #mena-digital-preview .quick a {
      min-height: 54px;
      background: var(--mm-paper);
      color: var(--mm-black);
      display: grid;
      place-items: center;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
    }
    #mena-digital-preview .quick a:hover { background: var(--mm-grey); }
    #mena-digital-preview .links { margin-top: 25px; border-top: 1px solid var(--mm-black); }
    #mena-digital-preview .action {
      color: var(--mm-black);
      border: 0;
      border-bottom: 1px solid var(--mm-black);
      appearance: none;
      -webkit-appearance: none;
      font-size: 13px;
      width: 100%;
      padding: 0;
      background: transparent;
      font-family: inherit;
      text-align: left;
    }
    #mena-digital-preview .action:hover { color: var(--mm-acid); }
    #mena-digital-preview .cta-arrow {
      display: block;
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      color: #0c0c0c;
    }
    #mena-digital-preview .action:focus-visible,
    #mena-digital-preview .quick a:focus-visible { outline: 2px solid var(--mm-black); outline-offset: -4px; }
    #mena-digital-preview .primary-action:focus-visible { outline: 2px solid var(--mm-acid); outline-offset: -4px; }
    #mena-digital-preview .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    @media (prefers-reduced-motion: reduce) {
      #mena-digital-preview *, #mena-digital-preview *::before, #mena-digital-preview *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
    #mena-digital-preview .footer {
      padding-top: 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    #mena-digital-preview .payoff {
      font-family: 'Archivo Black', Impact, sans-serif;
      font-size: 15px;
      line-height: .95;
    }
    #mena-digital-preview .url { font-size: 11px; font-weight: 700; }
    @media (max-width: 350px) {
      #mena-digital-preview { padding-inline: 6px; }
      #mena-digital-preview .hero, #mena-digital-preview .content { padding-inline: 19px; }
      #mena-digital-preview .brand-logo { width: 80%; }
    }
  </style>

  <article class="phone" aria-label="Biglietto da visita digitale di Sabrina Viva">

        <path d="M354.89,54.72h138.07v42.14h-86.26v24.04h61.5v38.92h-61.5v27.76h88.74v44.37h-140.55V54.72Z"/>
        <path d="M543.8,54.72h51.81l58,99.65h.5V54.72h50.07v177.23h-53.54l-56.27-100.39h-.5v100.39h-50.07V54.72Z"/>
        <path d="M816.51,54.72h52.8l65.69,177.23h-55.03l-8.68-26.03h-59.99l-8.68,26.03h-51.56l65.44-177.23ZM822.95,170.23h36.69l-11.15-34.71c-2.73-8.67-6.69-22.8-6.69-22.8h-.5s-3.72,14.13-6.69,22.8l-11.65,34.71Z"/>

        <a class="action cursor-interaction" href="https://www.linkedin.com/in/sabrina-viva"><span>LINKEDIN</span><svg class="cta-arrow" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/></svg></a>

  </article>
  <p id="share-status" class="sr-only" role="status" aria-live="polite"></p>
  <script>
    document.getElementById('save-sabrina-contact').addEventListener('click', function (event) {
      event.preventDefault();
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Viva;Sabrina;;;',
        'FN:Sabrina Viva',
        'ORG:MENA MEH!',
        'TITLE:Creative Director & Brand Strategist',
        'TEL;TYPE=CELL:+393447990872',
        'EMAIL;TYPE=WORK:sabrina@menameh.com',
        'URL;TYPE=HOME:https://www.menameh.com/sabrina/',
        'URL;TYPE=WORK:https://www.menameh.com',
        'END:VCARD'
      ].join('\r\n');
      const file = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(file);
      link.download = 'sabrina-viva.vcf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    });

    document.getElementById('share-card').addEventListener('click', async function () {
      const shareData = {
        title: 'Sabrina Viva — MENA MEH!',
        text: 'Il biglietto digitale di Sabrina Viva — MENA MEH!',
        url: 'https://www.menameh.com/sabrina/'
      };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (error) { /* condivisione annullata */ }
      } else {
        const label = this.querySelector('span');
        const original = label.textContent;
        const status = document.getElementById('share-status');
        let message = 'LINK COPIATO';
        try {
          await navigator.clipboard.writeText(shareData.url);
        } catch (error) {
          message = 'COPIA NON RIUSCITA';
        }
        label.textContent = message;
        status.textContent = message === 'LINK COPIATO' ? 'Link copiato negli appunti' : 'Copia del link non riuscita';
        setTimeout(() => { label.textContent = original; status.textContent = ''; }, 1800);
      }
    });
  </script>
